http:
  # 监听地址；远程 server 访问时改为管理网地址。
  listen: "127.0.0.1:19100"
  # 必须替换为真实 token，不能保留占位符。
  token: "REPLACE_WITH_DEPLOYMENT_SECRET"
storage:
  # agent 专用绝对目录；不要与其他实例共享。
  path: "/var/lib/deitysight"
  # 结果归档保留 24 小时，任务元数据保留 7 天。
  result_retention: "24h"
  task_retention: "168h"
  # 原始数据、临时文件、归档和下载租约共同计入预算。
  max_bytes: 1073741824
  min_free_bytes: 1073741824
background:
  # false 表示只在收到任务后采集。
  enabled: false
  step: "30s"
  retention: "10m"
sampling:
  default_window: "30s"
  default_step: "5s"
  max_window: "300s"
  min_step: "1s"
  max_points: 301
  # 单行上限；不是一整帧上限，越界会使当前帧无效。
  max_source_bytes: 1048576
atop:
  # 唯一采集源；false 时保留 HTTP，但不接受新任务。
  enabled: true
  mode: "parseable"
  binary: "/usr/bin/atop"
  startup_grace: "10s"
  finish_grace: "5s"
s3:
  # 默认关闭；启用后只为新 task 转存结果，已有归档不自动补传。
  enabled: false
  # s3（默认）或 yos；YOS 完整示例见 yos.example.yaml 和 README.md。
  provider: "s3"
  # 仅 YOS 可以显式允许内部 HTTP 网关；标准 S3 始终要求 HTTPS。
  allow_http: false
  endpoint: "https://s3.example.com"
  region: "us-east-1"
  bucket: "deitysight-results"
  prefix: "deitysight"
  # S3 兼容服务通常使用 path-style；AWS 可按需要设为 false。
  force_path_style: true
  access_key_id: "REPLACE_WITH_ACCESS_KEY_ID"
  secret_access_key: "REPLACE_WITH_SECRET_ACCESS_KEY"
  session_token: ""
  # 仅在查询 task 时签发链接；URL 不持久化、不写入日志。
  presign_ttl: "1h"
  upload_timeout: "2m"
  retry_initial: "5s"
  retry_max: "5m"
